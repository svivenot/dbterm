name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Multi-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev

      - name: Run Tests
        run: go test -v ./...

      - name: Build and Package Binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          # Target platforms: OS/ARCH/BINARY_NAME
          PLATFORMS=(
            "linux/amd64/dbterm"
            "linux/arm64/dbterm"
            "darwin/amd64/dbterm"
            "darwin/arm64/dbterm"
            "windows/amd64/dbterm.exe"
          )
          
          for item in "${PLATFORMS[@]}"; do
            IFS="/" read -r OS ARCH BIN_NAME <<< "$item"
            echo "==> Building TUI for $OS/$ARCH..."
            
            FOLDER_NAME="dbterm_${VERSION}_${OS}_${ARCH}"
            BUILD_DIR="dist/${FOLDER_NAME}"
            mkdir -p "$BUILD_DIR"
            
            GOOS=$OS GOARCH=$ARCH CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.Date=${DATE}" \
              -o "${BUILD_DIR}/${BIN_NAME}" \
              ./cmd/dbterm

            # For Linux amd64, also compile native desktop GUI binary
            if [ "$OS" = "linux" ] && [ "$ARCH" = "amd64" ]; then
              echo "==> Building Desktop GUI for linux/amd64..."
              go build \
                -trimpath \
                -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.Date=${DATE}" \
                -o "${BUILD_DIR}/dbterm-gui" \
                ./cmd/dbterm-gui
              cp "${BUILD_DIR}/dbterm-gui" "dist/dbterm-gui-${VERSION}-linux-amd64"
              chmod +x "dist/dbterm-gui-${VERSION}-linux-amd64"
            fi
            
            # Copy documentation & sanitized example config into the bundle
            cp README.md LICENSE connections.example.json "${BUILD_DIR}/"
            
            # Create distribution archive & standalone binary
            cd dist
            if [ "$OS" = "windows" ]; then
              cp "${FOLDER_NAME}/${BIN_NAME}" "dbterm-${VERSION}-${OS}-${ARCH}.exe"
              zip -r "${FOLDER_NAME}.zip" "${FOLDER_NAME}"
            else
              cp "${FOLDER_NAME}/${BIN_NAME}" "dbterm-${VERSION}-${OS}-${ARCH}"
              chmod +x "dbterm-${VERSION}-${OS}-${ARCH}"
              tar -czvf "${FOLDER_NAME}.tar.gz" "${FOLDER_NAME}"
            fi
            cd ..
          done
          
          # Compute SHA-256 checksums for security verification
          cd dist
          sha256sum *.tar.gz *.zip dbterm-* > checksums.txt
          echo "Generated Checksums:"
          cat checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/dbterm-*
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
